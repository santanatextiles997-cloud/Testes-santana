<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>Login — Notas Santana</title>
<meta name="theme-color" content="#0A1929"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="stylesheet" href="app-style.css"/>
<style>
  body{background:
    radial-gradient(circle at 20% -5%, rgba(29,111,224,.28), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(29,111,224,.08), transparent 40%),
    var(--color-primary);
    justify-content:center;align-items:center;padding:24px;}
  .login-wrap{width:100%;max-width:360px;}

  .logo-area{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
  .logo-icon{width:68px;height:68px;border-radius:19px;overflow:hidden;margin-bottom:18px;box-shadow:0 10px 30px rgba(29,111,224,.4), inset 0 1px 0 rgba(255,255,255,.15);}
  .logo-icon img{width:100%;height:100%;object-fit:cover;display:block;}
  .logo-area h1{color:#fff;font-size:23px;font-weight:700;}
  .logo-area .eyebrow{color:#6FA0FF;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;font-family:var(--font-mono);}
  .logo-area p{color:var(--color-drawer-muted);font-size:12.5px;margin-top:8px;}

  .login-card{background:#fff;border-radius:22px;padding:28px 24px 26px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
  .card-heading{margin-bottom:22px;}
  .card-heading h2{font-size:19px;font-weight:700;color:var(--color-primary);}
  .card-heading p{font-size:12.5px;color:var(--color-drawer-muted);margin-top:3px;}

  .login-card .field{margin-bottom:16px;}
  .input-icon-wrap{position:relative;}
  .input-icon-wrap svg.field-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--color-muted-light);fill:none;stroke-width:2;pointer-events:none;}
  .login-card .input{height:50px;padding-left:42px;font-size:15px;background:var(--color-surface-sunken);font-family:var(--font-mono);letter-spacing:.02em;}
  .login-card .input::placeholder{color:#9AA5B5;font-family:var(--font-family);letter-spacing:normal;}
  .login-card .input:focus{background:#fff;}
  .btn-toggle-senha{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:var(--color-muted-light);}
  .btn-toggle-senha:active{background:#EEF2FB;}
  .btn-toggle-senha svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  #inputSenha{padding-right:44px;}

  .btn-login{width:100%;height:52px;background:linear-gradient(135deg,var(--color-accent),var(--color-primary) 130%);color:#fff;border-radius:12px;font-size:14.5px;font-weight:700;letter-spacing:.02em;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;transition:opacity .15s,transform .1s;box-shadow:0 10px 24px rgba(29,111,224,.35);}
  .btn-login svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;}
  .btn-login:active{opacity:.9;transform:scale(.99);}
  .btn-login:disabled{opacity:.6;}

  .error-msg{background:var(--color-danger-dim);border:1px solid rgba(185,28,28,.22);color:var(--color-danger);font-size:12.5px;font-weight:600;padding:11px 14px;border-radius:10px;margin-bottom:16px;display:none;}
  .error-msg.show{display:block;}

  .footer-note{text-align:center;color:#4A6488;font-size:10.5px;margin-top:26px;font-family:var(--font-mono);letter-spacing:.03em;line-height:1.6;}

  .spinner-btn{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
  .spinner-btn.show{display:block;}

  @keyframes entradaSuave{from{opacity:0;transform:translateY(32px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .logo-area{animation:entradaSuave .65s cubic-bezier(.19,1,.22,1) both;}
  .login-card{animation:entradaSuave .7s cubic-bezier(.19,1,.22,1) .18s both;}
  .footer-note{animation:entradaSuave .6s cubic-bezier(.19,1,.22,1) .38s both;}
</style>
</head>
<body data-publica>

<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-icon"><img src="icons/icon-192.png" alt="Notas Santana"/></div>
    <h1>Notas Santana</h1>
    <div class="eyebrow">Santana Textiles</div>
    <p>Acesse sua conta para continuar</p>
  </div>

  <div class="login-card">
    <div class="card-heading">
      <h2>Bem-vindo</h2>
      <p>Acesse com suas credenciais</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field">
      <label for="inputUsuario">Usuário</label>
      <div class="input-icon-wrap">
        <svg class="field-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input class="input" type="text" id="inputUsuario" inputmode="numeric" placeholder="Digite seu usuário" autocomplete="username"/>
      </div>
    </div>

    <div class="field">
      <label for="inputSenha">Senha</label>
      <div class="input-icon-wrap">
        <svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input class="input" type="password" id="inputSenha" placeholder="Digite sua senha" autocomplete="current-password"/>
        <button type="button" class="btn-toggle-senha" id="btnToggleSenha" aria-label="Mostrar senha">
          <svg id="iconOlho" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="btnLogin">
      <span id="btnLoginText">Entrar</span>
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      <div class="spinner-btn" id="spinnerBtn"></div>
    </button>
  </div>

  <p class="footer-note">Santana Textiles — Acesso restrito</p>
</div>

<script src="app-shell.js"></script>
<script>
// Já logado (token presente)? Vai direto para o início.
if (localStorage.getItem(_k('token')) && localStorage.getItem(_k('nome'))) {
  window.location.replace('index.html');
}

const inputUsuario = document.getElementById('inputUsuario');
const inputSenha = document.getElementById('inputSenha');
const btnLogin = document.getElementById('btnLogin');
const btnLoginText = document.getElementById('btnLoginText');
const spinnerBtn = document.getElementById('spinnerBtn');
const errorMsg = document.getElementById('errorMsg');

const mostrarErro = (msg) => { errorMsg.textContent = msg; errorMsg.classList.add('show'); };
const esconderErro = () => errorMsg.classList.remove('show');

async function fazerLogin() {
  const usuario = inputUsuario.value.trim();
  const senha = inputSenha.value.trim();
  esconderErro();
  if (!usuario || !senha) { mostrarErro('Preencha usuário e senha.'); return; }

  btnLogin.disabled = true;
  btnLoginText.textContent = 'Entrando...';
  spinnerBtn.classList.add('show');

  try {
    // Modo demo: entra sem servidor, só para ver o visual do app.
    if (APP.demo) {
      salvarSessao({ token: 'demo', nome: 'Usuário Demo', funcao: 'Operador', nivel: 'ADM' }, usuario);
      window.location.replace('index.html');
      return;
    }

    // Não usa apiPost: login sem token, e 401 aqui é "senha errada", não "sessão expirada".
    const res = await fetch(APP.apiBase + APP.apiPrefixo + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, senha })
    });
    const data = await res.json();

    if (!data.ok || !data.token) {
      // O servidor limita tentativas: se bloqueou (429), mostra a mensagem dele.
      mostrarErro(res.status === 429 ? (data.erro || 'Muitas tentativas. Aguarde.') : 'Usuário ou senha incorretos.');
      return;
    }
    salvarSessao(data, usuario);
    window.location.replace('index.html');
  } catch (e) {
    mostrarErro('Erro de conexão. Verifique sua internet.');
  } finally {
    btnLogin.disabled = false;
    btnLoginText.textContent = 'Entrar';
    spinnerBtn.classList.remove('show');
  }
}

btnLogin.addEventListener('click', fazerLogin);
inputSenha.addEventListener('keydown', (e) => { if (e.key === 'Enter') fazerLogin(); });

const btnToggleSenha = document.getElementById('btnToggleSenha');
const iconOlho = document.getElementById('iconOlho');
btnToggleSenha.addEventListener('click', () => {
  const visivel = inputSenha.type === 'text';
  inputSenha.type = visivel ? 'password' : 'text';
  iconOlho.innerHTML = visivel
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.62 21.62 0 015.06-6.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a21.6 21.6 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  btnToggleSenha.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
});
</script>
</body>
</html>
