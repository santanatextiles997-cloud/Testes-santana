<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>Novo registro — Notas Santana</title>
<meta name="theme-color" content="#0A1929"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="stylesheet" href="app-style.css"/>
<style>
  .form-card{margin:0 16px 16px;}
  .form-actions{display:flex;gap:10px;margin:0 16px;}
  .form-actions .btn{flex:1;}
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-btn" onclick="history.back()" aria-label="Voltar">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="topbar-title">Novo registro</div>
</div>

<div class="content">
  <div class="page-header">
    <div class="page-title">Novo registro</div>
    <div class="page-count">Bipe o código e descreva o que aconteceu</div>
  </div>

  <div class="banner erro" id="bannerErro" style="display:none;">
    <div class="icn"><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
    <div class="txt"><div class="ttl">Não foi possível salvar</div><div class="sub" id="bannerErroTxt"></div></div>
  </div>

  <div class="card form-card">
    <div class="field">
      <label for="fCodigo">Código da peça</label>
      <input class="bipe-input" id="fCodigo" placeholder="Bipe ou digite o código" autocomplete="off" autocapitalize="characters"/>
      <div class="hint">O leitor preenche sozinho; o Enter também confirma.</div>
    </div>

    <div class="field">
      <label for="fTipo">Tipo</label>
      <select class="input" id="fTipo">
        <option value="">Selecione…</option>
        <option>Peça misturada</option>
        <option>Avaria</option>
        <option>Divergência</option>
        <option>Outro</option>
      </select>
    </div>

    <div class="field">
      <label for="fObs">Observação</label>
      <textarea class="input" id="fObs" placeholder="Explique o que aconteceu"></textarea>
    </div>

    <div class="switch-row">
      <span>Marcar como urgente</span>
      <label class="switch"><input type="checkbox" id="fUrgente"/><span class="switch-slider"></span></label>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-outline" onclick="history.back()">Cancelar</button>
    <button class="btn btn-primary" id="btnSalvar">Salvar registro</button>
  </div>
</div>

<div class="bottom-nav">
  <a class="nav-item" href="index.html" data-page="home">
    <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    <span>Início</span>
  </a>
  <a class="nav-item" href="lista.html" data-page="lista">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    <span>Registros</span>
  </a>
  <a class="nav-item" href="formulario.html" data-page="novo">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Novo</span>
  </a>
</div>

<script>
window.APP_DEMO = { '/registros/novo': { ok: true, id: 'R-1043' } };
</script>
<script src="app-shell.js"></script>
<script>
initBottomNav('novo');

const fCodigo = document.getElementById('fCodigo');
const btnSalvar = document.getElementById('btnSalvar');
setTimeout(() => fCodigo.focus(), 200);

// Leitor de código de barras: ao bipar, pula para o próximo campo.
criarDetectorLeitor(fCodigo, () => document.getElementById('fTipo').focus());

function mostrarErro(msg) {
  document.getElementById('bannerErroTxt').textContent = msg;
  document.getElementById('bannerErro').style.display = 'flex';
}

btnSalvar.addEventListener('click', async () => {
  document.getElementById('bannerErro').style.display = 'none';
  const dados = {
    codigo: fCodigo.value.trim(),
    tipo: document.getElementById('fTipo').value,
    obs: document.getElementById('fObs').value.trim(),
    urgente: document.getElementById('fUrgente').checked,
  };
  // Validação de tela é só conveniência: o Worker valida tudo de novo.
  if (!dados.codigo) { mostrarErro('Informe o código da peça.'); return; }
  if (!dados.tipo) { mostrarErro('Escolha o tipo do registro.'); return; }

  btnSalvar.disabled = true;
  btnSalvar.textContent = 'Salvando…';
  try {
    // Contrato: POST {apiPrefixo}/registros/novo { codigo, tipo, obs, urgente } → { ok, id }
    await apiPost('/registros/novo', dados);
    toast('Registro salvo', 'success');
    setTimeout(() => window.location.replace('lista.html'), 700);
  } catch (e) {
    mostrarErro(e.message || 'Tente de novo em instantes.');
    btnSalvar.disabled = false;
    btnSalvar.textContent = 'Salvar registro';
  }
});
</script>
</body>
</html>
